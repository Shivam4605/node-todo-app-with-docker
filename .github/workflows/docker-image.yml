name: CI-CD

on:
  push:
    branches:
      - main

jobs:

  build-push:
    runs-on: ubuntu-latest

    env:
      REGION: us-east-1
      ACCOUNT_ID: 784803613534
      REPO_NAME: node-todo-app
      IMAGE_TAG: latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ${{ env.REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t node-app .

      - name: Tag Docker Image
        run: |
          docker tag node-app:latest \
          ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
          ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            REGION="us-east-1"
            ACCOUNT_ID="784803613534"
            REPO_NAME="node-todo-app"
            IMAGE_TAG="latest"

            REGISTRY="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
            IMAGE_URI="$REGISTRY/$REPO_NAME:$IMAGE_TAG"

            export AWS_ACCESS_KEY_ID='${{ secrets.AWS_KEY }}'
            export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET }}'
            export AWS_DEFAULT_REGION="$REGION"

            echo "Login to ECR"
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY

            echo "Pull Latest Image"
            docker pull $IMAGE_URI

            echo "Stop Old Container"
            docker stop node-app || true
            docker rm node-app || true

            echo "Run New Container"
            docker run -d \
              --name node-app \
              --restart unless-stopped \
              -p 8000:8000 \
              $IMAGE_URI

            docker ps
