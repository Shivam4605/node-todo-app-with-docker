name: CI-CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: docker build -t node-app .

      - name: Tag Image
        run: docker tag node-app:latest 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app:latest

      - name: Push Image
        run: docker push 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # AWS Region and ECR details
            REGION="us-east-1"
            ACCOUNT_ID="784803613534"
            REPO_NAME="node-todo-app"
            IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO_NAME:latest"

            # Login to ECR (EC2 should have IAM Role or aws configure)
            aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

            # Pull latest image
            docker pull $IMAGE_URI

            # Stop and remove old container if exists
            docker stop node-app || true
            docker rm node-app || true

            # Remove dangling images (optional cleanup)
            docker image prune -f || true

            # Run new container
            docker run -d \
              --name node-app \
              --restart unless-stopped \
              -p 8000:8000 \
              $IMAGE_URI

            # Show running containers
            docker ps
                