name: CI-CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: docker build -t node-app .

      - name: Tag Image
        run: docker tag node-app:latest 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app

      - name: Push Image
        run: docker push 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app
        
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo aws ecr get-login-password --region us-east-1 | docker login --username shivam --password-shivam@123 784803613534.dkr.ecr.us-east-1.amazonaws.com
            sudo docker pull 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app:latest
            sudo docker stop node-app || true
            sudo docker rm node-app || true
            sudo docker run -d --name node-app -p 8000:8000 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app:latest
    