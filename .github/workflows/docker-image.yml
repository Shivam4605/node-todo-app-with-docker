name: CI-CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: docker build -t node-app .

      - name: Tag Image
        run: docker tag node-app:latest 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app

      - name: Push Image
        run: docker push 784803613534.dkr.ecr.us-east-1.amazonaws.com/node-todo-app